let th=.35,ph=.95,rad=620,fly=false,ft=0;const fp=new T.CatmullRomCurve3([[180,260,420],[420,210,160],[390,190,-260],[80,230,-430],[-330,200,-300],[-430,210,80],[-230,230,380]].map(a=>new T.Vector3(...a)),true);const tgt=new T.Vector3(0,0,20),goal=tgt.clone();

const ps=new Map();let moved=0,pd=0;const el=ren.domElement;

el.addEventListener('pointerup',e=>{if(ps.size==1&&moved<5)click(e);ps.delete(e.pointerId)});
const dist=()=>{const a=[...ps.values()];return Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY)};
el.addEventListener('pointermove',e=>{const p=ps.get(e.pointerId);if(!p)return;const dx=e.clientX-p.clientX,dy=e.clientY-p.clientY;ps.set(e.pointerId,e);moved+=Math.abs(dx)+Math.abs(dy);
 if(ps.size==2){const d=dist();rad=Math.max(80,Math.min(1400,rad*pd/d));pd=d;return}
 if(e.buttons==2||e.shiftKey){const k=rad*.0016,sx=Math.sin(th),cx=Math.cos(th);goal.x-=(dx*cx+dy*sx)*k;goal.z-=(-dx*sx+dy*cx)*k;tgt.copy(goal)}
 else{th-=dx*.006;ph=Math.max(.12,Math.min(1.45,ph-dy*.006))}});
el.addEventListener('wheel',e=>{e.preventDefault();rad=Math.max(80,Math.min(1400,rad*(1+e.deltaY*.001)))},{passive:false});

 const c=dusk?0x2b3a55:0xbcd6e4;sc.background.setHex(c);sc.fog.color.setHex(c);hemi.intensity=dusk?.35:.8;sun.intensity=dusk?.25:.9;sun.color.setHex(dusk?0xff9a5a:0xfff1d6);sun.position.set(dusk?300:-260,dusk?120:340,dusk?-200:240);win.forEach(m=>m.emissiveIntensity=dusk?1.1:0)};

$('br').onclick=()=>{th=.35;ph=.95;rad=620;goal.set(0,0,20);info.textContent='Click any building or zone to focus and read its role.'};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

let tm=0,last=performance.now();const dtc=new T.Vector3();

 if(fly){ft+=dt/75;if(ft>=1)stopFly();else{cam.position.copy(fp.getPointAt(ft));dtc.set(0,18,10);cam.lookAt(dtc)}}else{tgt.lerp(goal,.08);setCam()}
 waterM.emissiveIntensity=.3+.15*Math.sin(tm*1.5);

 birds.forEach(b=>{const u=b.userData,a=tm*u.s+u.o;b.position.set(Math.cos(a)*u.r,u.h+Math.sin(tm*2+u.o)*4,Math.sin(a)*u.r*.8);b.rotation.y=Math.atan2(-Math.sin(a)*u.r,Math.cos(a)*u.r*.8)});
 zl.forEach(z=>z.f===curFloor?place(z.d,z.v):z.d.style.display='none');ids.forEach(k=>place(lbs[k],Z[k].a));extra.forEach(e=>place(e.d,e.v));ren.render(sc,cam)})();
